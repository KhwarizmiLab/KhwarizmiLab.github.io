name: "NeSQom 2026"
title: "NSF Workshop on Quantum Communication and Networked Systems"
description: >-
  Bringing classical networking, distributed systems, quantum networking,
  and quantum information science together to shape the systems architecture
  of future quantum networks.

event:
  date: "September 10-11, 2026"
  location: "University of Massachusetts Amherst"
  address: "Amherst, Massachusetts"
  format: "A one-and-a-half-day interdisciplinary workshop with presentations, panels, and interactive discussion, followed by breakout sessions and lightning talks."
  audience: "Approximately 50 researchers from classical and quantum networking communities"
  organizers:
    - name: "Taqi Raza"
      url: "https://people.umass.edu/taqi/"
    - name: "Don Towsley"
  attendance: "Attendance is by invitation only"

actions:
  - label: "Tentative agenda"
    detail: "September 10-11"
    url: "#agenda"

overview:
  eyebrow: "About NeSQom"
  title: "Connecting classical networking and quantum systems"
  body: >-
    Quantum networks will be hybrid systems in which quantum communication
    and classical networking are tightly integrated. NeSQom will convene
    researchers across both communities to identify where established
    networking principles transfer, where they break down, and what new
    abstractions are needed for correct, scalable, and manageable systems.

program:
  eyebrow: "Technical program"
  title: "Four themes for a shared research agenda"
themes:
  - number: "01"
    title: "Routing and Resource Allocation"
    description: >-
      How should quantum networks route a resource that cannot be copied,
      degrades over time, and is consumed when used?
    topics:
      - Entanglement routing and path selection
      - Quantum-memory allocation and generation scheduling
      - Fidelity, coherence-time, and hardware constraints
  - number: "02"
    title: "Control Planes and Orchestration"
    description: >-
      How should quantum networks coordinate state, control, and management
      under tight latency and hardware constraints?
    topics:
      - Control- and data-plane separation
      - Fidelity monitoring and adaptive routing
      - Centralized versus distributed control
  - number: "03"
    title: "Hybrid Classical-Quantum Architectures"
    description: >-
      How should permanent dependencies between classical and quantum
      infrastructure shape interfaces, security, and system design?
    topics:
      - Classical-quantum layer interfaces
      - Coordination for QKD and distributed computing
      - Security and performance tradeoffs
  - number: "04"
    title: "Performance and Experimental Methods"
    description: >-
      What models, metrics, simulators, and testbeds are needed for meaningful
      evaluation of quantum network systems?
    topics:
      - Analytical models, simulation, and testbeds
      - Fidelity, generation-rate, and purification metrics
      - Shared evaluation standards

