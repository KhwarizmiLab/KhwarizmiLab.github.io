overview:
  eyebrow: "About the event"
  title: "Research across systems and algorithms"
  body: >-
    The symposium will create a focused setting for sharing new results,
    identifying open problems, and forming collaborations across communities.
    It reflects the Khwarizmi Lab's goal of developing secure, effective, and
    trustworthy networked systems.

themes:
  - number: "01"
    title: "Financial Technology & Security"
    description: >-
      Security, privacy, authentication, and trustworthy operation in payment
      platforms and other large-scale financial systems.
    topics:
      - Payment and digital-wallet security
      - Authentication and access control
      - Measurement and verification of deployed systems
  - number: "02"
    title: "Quantum Networks"
    description: >-
      Practical approaches to secure quantum communication and the systems
      needed to move quantum networking from theory to deployment.
    topics:
      - Quantum key distribution
      - Post-quantum and hybrid systems
      - End-to-end security under real-world constraints
  - number: "03"
    title: "Critical & Mobile Infrastructure"
    description: >-
      Resilient, efficient, and secure designs for next-generation mobile
      networks and the critical infrastructure that depends on them.
    topics:
      - 5G and next-generation networks
      - Industrial control systems
      - Reliability, safety, and scalable operation

