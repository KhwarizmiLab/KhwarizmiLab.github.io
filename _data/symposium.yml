            - "Zheshen Zhang"
            - "Eden Figueroa"
          moderator: "Kaushik P. Seshadreesan"
        - time: "2:30 p.m."
          title: "Breakout Session"
          location: "Hadley Room (10th floor), Room 804, and Room 803 at the Campus Center"
          breakout:
            groups:
              - name: "Group 1"
                room: "Hadley Room (10th floor)"
                question: >-
                  How can quantum networks remain robust in the face of loss,
                  errors, and failures, and which ideas from classical
                  fault-tolerant networking can be adapted?
                moderator: "Eden Figueroa"
              - name: "Group 2"
                room: "Room 804"
                question: >-
                  How should quantum networks approach routing, path selection,
                  and resource allocation, and which techniques can be adapted
                  from classical networking?
                moderator: "Raj Kettimuthu"
              - name: "Group 3"
                room: "Room 803"
                question: >-
                  What new services should quantum networks enable—such as
                  distributed quantum computing and sensing—and which service
                  abstractions can be adapted from classical networking?
                moderator: "Zheshen Zhang"
            common_question:
              label: "If time permits"
              title: "Question for all groups"
              prompt: >-
                What other networking challenges should the community explore?
                Possibilities include quantum security, quantum-classical
                coexistence, control- and data-plane separation, network
                management, open-source tools and testbeds, and other emerging
                priorities.
